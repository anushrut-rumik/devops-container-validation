name: Docker Build and Container Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: devops-container-validation:${{ github.sha }}

      - name: Start and verify the built container
        run: bash scripts/check-container.sh "devops-container-validation:$GITHUB_SHA"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the verified image
        if: env.DOCKERHUB_CONFIGURED == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          image="$DOCKERHUB_USERNAME/devops-container-validation"
          docker tag "devops-container-validation:$GITHUB_SHA" "$image:$GITHUB_SHA"
          docker tag "devops-container-validation:$GITHUB_SHA" "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"

      - name: Explain skipped publishing
        if: env.DOCKERHUB_CONFIGURED != 'true'
        run: |
          echo '### Tests, Docker build, and running-container checks passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Docker Hub publishing was skipped. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets to enable it.' >> "$GITHUB_STEP_SUMMARY"
