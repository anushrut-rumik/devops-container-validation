name: Docker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_CONFIGURED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.DOCKERHUB_CONFIGURED == 'true' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/temperature-conversion-api:latest
            ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/temperature-conversion-api:${{ github.sha }}

      - name: Explain skipped publishing
        if: env.DOCKERHUB_CONFIGURED != 'true'
        run: |
          echo '### Tests and Docker build completed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Docker Hub publishing was skipped. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN as repository secrets to enable it.' >> "$GITHUB_STEP_SUMMARY"
